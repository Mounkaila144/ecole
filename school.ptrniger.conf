<VirtualHost *:443>
    ServerName school.ptrniger.com
    DocumentRoot /var/www/ecole

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/school.ptrniger.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/school.ptrniger.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Enable RewriteEngine
    RewriteEngine On
    # Laravel backend directory configuration
    <Directory /var/www/ecole>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/school.ptrniger-error.log
    CustomLog ${APACHE_LOG_DIR}/school.ptrniger-access.log combined
</VirtualHost>
